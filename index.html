<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabrina Residences</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Archivo:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* STEP 1 — FONTS & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            font-family: 'Archivo', sans-serif;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* STEP 2 — PAGE BACKGROUND */
        body {
            background: linear-gradient(180deg, #1150ef 0%, #135af3 30%, #3c7af6 52%, #76a2fa 64%, #86acfb 70%, #b9cffd 84%, #ffffff 100%);
            background-attachment: fixed;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cloud glow overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(40% 18% at 30% 12%, rgba(120,170,255,.35)),
                radial-gradient(35% 14% at 78% 26%, rgba(130,175,255,.28)),
                radial-gradient(30% 10% at 55% 3%, rgba(110,160,255,.3));
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* Vertical grid lines */
        .grid-line {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            background: rgba(255, 255, 255, .28);
            transform-origin: top center;
            transform: scaleY(0);
            animation: growLine 1.6s cubic-bezier(.65,0,.35,1) forwards;
        }

        .grid-line:nth-child(1) { left: 4.8%; }
        .grid-line:nth-child(2) { left: 35.45%; }
        .grid-line:nth-child(3) { left: 64.7%; }
        .grid-line:nth-child(4) { left: 95.2%; }

        @keyframes growLine {
            to {
                transform: scaleY(1);
            }
        }

        /* STEP 3 — HERO SECTION */
        .hero {
            position: relative;
            overflow: hidden;
            min-height: clamp(760px, 75vw, 1300px);
            display: flex;
            flex-direction: column;
        }

        /* Main house image */
        .hero-image {
            position: absolute;
            right: 4.8vw;
            bottom: 0;
            width: max(83vw, 640px);
            height: auto;
            z-index: 1;
            opacity: 0;
            transform: translateY(70%) scale(1.06);
            animation: parallaxRise 4.2s cubic-bezier(.22,.61,.24,1) .2s forwards;
        }

        @keyframes parallaxRise {
            0% {
                opacity: 0;
                transform: translateY(70%) scale(1.06);
            }
            25% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* STEP 4 — HEADER / NAV */
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            padding: 24px clamp(16px,2.2vw,40px) 0;
            z-index: 10;
            position: relative;
        }

        .logo {
            width: 40px;
            height: 30px;
        }

        .nav-center {
            display: flex;
            gap: 1px;
            justify-content: center;
        }

        .nav-item {
            height: 40px;
            padding: 0 18px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            letter-spacing: -.035em;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s ease;
        }

        .nav-item.home {
            background-color: #fff;
            color: #161616;
        }

        .nav-item:not(.home) {
            background-color: rgba(255,255,255,.16);
            backdrop-filter: blur(8px);
        }

        .nav-item:not(.home"):hover {
            background-color: rgba(255,255,255,.3);
        }

        .nav-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .language-switch {
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background-color: rgba(255,255,255,.16);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .language-btn {
            padding: 0 8px;
            height: 32px;
            border-radius: 999px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
        }

        .language-btn.active {
            background-color: #fff;
            color: #161616;
        }

        .language-btn.inactive {
            background-color: transparent;
            color: #fff;
        }

        .sign-in {
            height: 41px;
            padding: 0 19px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            transition: all .3s ease;
        }

        .sign-in:hover {
            background-color: #fff;
            color: #1150ef;
        }

        .hamburger {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255,255,255,.16);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dropdown {
            position: absolute;
            top: 78px;
            right: 0;
            width: clamp(140px,20vw,220px);
            border-radius: 24px;
            padding: 10px;
            gap: 6px;
            background-color: rgba(255,255,255,.18);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.3);
            z-index: 20;
            display: none;
        }

        .dropdown.active {
            display: flex;
            flex-direction: column;
        }

        .dropdown-item {
            height: 48px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            font-size: 13px;
            letter-spacing: -.035em;
            cursor: pointer;
            transition: all .3s ease;
        }

        .dropdown-item.home {
            background-color: #fff;
            color: #161616;
        }

        .dropdown-item:not(.home) {
            background-color: transparent;
            color: #fff;
        }

        /* Nav item animation */
        .nav-item {
            opacity: 0;
            transform: translateY(-14px);
            animation: navFadeDown .8s cubic-bezier(.2,.7,.2,1) forwards;
        }

        .logo { animation-delay: .1s; }
        .nav-item.home { animation-delay: .2s; }
        .nav-item.properties { animation-delay: .28s; }
        .nav-item.agent { animation-delay: .36s; }
        .nav-item.partner { animation-delay: .44s; }
        .language-switch { animation-delay: .52s; }
        .sign-in { animation-delay: .6s; }
        .hamburger { animation-delay: .65s; }

        @keyframes navFadeDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* STEP 5 — HERO HEADLINE + TAGLINE */
        .hero-content {
            display: flex;
            flex-wrap: wrap;
            column-gap: 24px;
            padding: clamp(28px,3.4vw,60px) clamp(16px,2.2vw,40px) 0;
            z-index: 3;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 250px;
        }

        .hero-headline {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            text-transform: uppercase;
            font-size: clamp(40px, calc(39px + 4.9vw), 170px);
            line-height: .87;
            letter-spacing: -.005em;
            margin-bottom: 24px;
        }

        .hero-headline-line {
            display: block;
            padding-left: .92em;
        }

        .hero-tagline {
            font-family: 'Archivo', sans-serif;
            text-transform: uppercase;
            font-size: clamp(13px,1.66vw,26px);
            line-height: 1.02;
            letter-spacing: -.045em;
            margin-left: auto;
            margin-top: clamp(24px,4.3vw,80px);
            max-width: 500px;
        }

        .tagline-line {
            display: block;
            text-indent: 3.6em;
        }

        /* STEP 6 — EXPLORE LINK */
        .explore-link {
            padding: clamp(36px,5.6vw,100px) clamp(16px,2.2vw,40px) 0;
            display: flex;
            align-items: center;
            gap: clamp(18px,2.4vw,34px);
            font-size: clamp(13px,1.3vw,20px);
            letter-spacing: -.01em;
            cursor: pointer;
            transition: opacity .3s ease;
        }

        .explore-link:hover {
            opacity: .8;
        }

        /* STEP 7 — BOTTOM-LEFT VIDEO CARD */
        .video-card {
            position: absolute;
            left: clamp(16px,2.2vw,40px);
            bottom: clamp(36px,8.6vw,140px);
            width: clamp(150px,17vw,290px);
            z-index: 3;
            opacity: 0;
            transform: translateY(30px) scale(.97);
            animation: cardAppear 1s forwards 2s;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .video-box {
            aspect-ratio: 1.7;
            border-radius: clamp(8px,.9vw,14px);
            overflow: hidden;
            background-color: rgba(255,255,255,.2);
            position: relative;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: clamp(8px,.9vw,14px);
        }

        .video-caption {
            margin-top: 8px;
            font-family: 'Manrope', sans-serif;
            font-size: clamp(13px,1.4vw,22px);
            line-height: 1.02;
            letter-spacing: .035em;
            text-align: center;
        }

        .progress-bars {
            margin-top: 12px;
            display: flex;
            gap: 5px;
            height: 14px;
            cursor: pointer;
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background-color: rgba(255,255,255,.4);
            transition: all .6s ease;
            position: relative;
        }

        .progress-bar.active {
            flex: 1.7;
            background-color: #fff;
        }

        /* Progress bar animation */
        .video-card .progress-bar {
            transform-origin: left center;
            transform: scaleX(0);
            animation: progressFill .9s forwards 2.55s;
        }

        @keyframes progressFill {
            to {
                transform: scaleX(1);
            }
        }

        /* STEP 8 — WORD-BY-WORD TEXT ANIMATION ("wordIn") */
        .word-in {
            opacity: 0;
            transform: translateY(.45em) blur(10px);
            animation: wordIn 1s cubic-bezier(.2,.7,.2,1) forwards;
        }

        @keyframes wordIn {
            to {
                opacity: 1;
                transform: translateY(0) blur(0);
            }
        }

        /* STEP 9 — SECTION 2: "OUR LATEST HOUSES" */
        .section-latest-houses {
            padding: clamp(56px,9.9vw,170px) clamp(16px,4vw,70px) clamp(40px,4.4vw,80px) clamp(16px,2.8vw,48px);
        }

        .section-title {
            flex: 1 1 max(200px,24.5vw);
            margin-top: clamp(0px,.9vw,16px);
        }

        .section-title h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: clamp(40px,4.6vw,80px);
            line-height: 1.2;
            color: #0d0d0d;
            text-decoration: underline;
            text-underline-position: under;
            text-underline-offset: .06em;
            text-underline-thickness: 1.5px;
        }

        .section-title h2 span {
            display: block;
        }

        .houses-gallery {
            flex: 999 1 540px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: clamp(10px,1.25vw,20px);
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .houses-gallery::-webkit-scrollbar {
            display: none;
        }

        .house-card {
            aspect-ratio: .79;
            border-radius: clamp(6px,.8vw,12px);
            overflow: hidden;
            scroll-snap-align: start;
            position: relative;
        }

        .house-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s ease;
        }

        .house-card:hover img {
            transform: scale(1.05);
        }

        /* Animation for section title */
        .section-title h2 span {
            opacity: 0;
            transform: translateY(.45em) blur(10px);
            animation: wordIn 1s cubic-bezier(.2,.7,.2,1) forwards;
        }

        .section-title h2 span:nth-child(1) { animation-delay: 0s; }
        .section-title h2 span:nth-child(2) { animation-delay: .15s; }
        .section-title h2 span:nth-child(3) { animation-delay: .3s; }

        /* Animation for house cards */
        .house-card {
            opacity: 0;
            transform: translateY(30px) scale(.97);
            animation: cardRise 1.1s cubic-bezier(.2,.7,.2,1) forwards;
        }

        .house-card:nth-child(1) { animation-delay: .2s; }
        .house-card:nth-child(2) { animation-delay: .35s; }
        .house-card:nth-child(3) { animation-delay: .5s; }

        @keyframes cardRise {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* STEP 10 — RESPONSIVE RULES */
        @media (max-width: 860px) {
            .nav-center {
                display: none;
            }

            .hero-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .hero-tagline {
                margin-left: auto;
                margin-top: clamp(24px,4.3vw,80px);
            }

            .video-card {
                left: 16px;
                bottom: 36px;
                width: clamp(150px,20vw,200px);
            }
        }

        @media (min-width: 861px) {
            .hamburger {
                display: none;
            }

            .dropdown {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- STEP 2 — PAGE BACKGROUND -->
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>

    <!-- STEP 3 — HERO SECTION -->
    <section class="hero">
        <!-- STEP 4 — HEADER / NAV -->
        <header class="header">
            <div class="logo">
                <!-- SVG Logo placeholder -->
                <svg width="40" height="30" viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 15L30 10L30 20L20 25L10 20L10 10L20 15Z" fill="white"/>
                </svg>
            </div>

            <div class="nav-center">
                <div class="nav-item home">HOME</div>
                <div class="nav-item properties">PROPERTIES</div>
                <div class="nav-item agent">AGENT</div>
                <div class="nav-item partner">PARTNER</div>
            </div>

            <div class="nav-right">
                <div class="language-switch">
                    <div class="language-btn active">EN</div>
                    <div class="language-btn inactive">BA</div>
                </div>

                <div class="sign-in">SIGN IN</div>

                <div class="hamburger" id="hamburger">
                    <!-- Hamburger menu icon -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 6H21M3 12H21M3 18H21" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>

                <div class="dropdown" id="dropdown">
                    <div class="dropdown-item home">HOME</div>
                    <div class="dropdown-item properties">PROPERTIES</div>
                    <div class="dropdown-item agent">AGENT</div>
                    <div class="dropdown-item partner">PARTNER</div>
                </div>
            </div>
        </header>

        <!-- STEP 5 — HERO HEADLINE + TAGLINE -->
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-headline">
                    <span class="hero-headline-line word-in">SABRINA</span>
                    <span class="hero-headline-line word-in">RESIDENCES</span>
                    <span class="hero-headline-line word-in">HOUSE</span>
                </h1>

                <p class="hero-tagline">
                    <span class="tagline-line word-in">TRUSTED REAL ESTATE</span>
                    <span class="tagline-line word-in">EXPERTS FOR A SMOOTHER, SMARTER</span>
                    <span class="tagline-line word-in">PROPERTY JOURNEY.</span>
                </p>
            </div>
        </div>

        <!-- STEP 6 — EXPLORE LINK -->
        <div class="explore-link">
            <span class="word-in">EXPLORE PROPERTIES</span>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 16.5L16.5 1.5M16.5 1.5H1.5M16.5 1.5V16.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- STEP 7 — BOTTOM-LEFT VIDEO CARD -->
        <div class="video-card">
            <div class="video-box">
                <video id="heroVideo" autoplay muted loop playsinline>
                    <source src="https://cdn.sceneai.art/Hero%20Section%20Video/adec243d-ffda-48cf-a8a8-26e6d6bcbe9b.mp4" type="video/mp4">
                </video>
            </div>

            <div class="video-caption word-in">Find a home that fits / your lifestyle</div>

            <div class="progress-bars">
                <div class="progress-bar"></div>
                <div class="progress-bar active"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
            </div>
        </div>

        <!-- STEP 3 — MAIN HOUSE IMAGE -->
        <img src="https://cdn.sceneai.art/Bg%20images/1dd58514-cedb-4f70-9aee-709c3f887808.png" alt="Main house" class="hero-image">
    </section>

    <!-- STEP 9 — SECTION 2: "OUR LATEST HOUSES" -->
    <section class="section-latest-houses">
        <div class="section-title">
            <h2>
                <span class="word-in">OUR</span>
                <span class="word-in">LATEST</span>
                <span class="word-in">Houses</span>
            </h2>
        </div>

        <div class="houses-gallery">
            <div class="house-card">
                <img src="https://cdn.sceneai.art/Bg%20images/c789ac4d-f2c8-463a-93f6-1f8c6fa09f9a.png" alt="House 1">
            </div>
            <div class="house-card">
                <img src="https://cdn.sceneai.art/Bg%20images/bf2e3004-db02-48a1-8e15-c6a58c158b5c.png" alt="House 2">
            </div>
            <div class="house-card">
                <img src="https://cdn.sceneai.art/Bg%20images/dce07180-2db9-45fe-889a-7a11657c6234.png" alt="House 3">
            </div>
        </div>
    </section>

    <script>
        // STEP 10 — RESPONSIVE RULES
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const dropdown = document.getElementById('dropdown');

            // Toggle dropdown menu on mobile
            hamburger.addEventListener('click', function() {
                dropdown.classList.toggle('active');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                    dropdown.classList.remove('active');
                }
            });

            // Language switch functionality
            const languageBtns = document.querySelectorAll('.language-btn');
            languageBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    languageBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Video progress bars functionality
            const video = document.getElementById('heroVideo');
            const progressBars = document.querySelectorAll('.progress-bar');

            // Function to update progress bars based on video time
            function updateProgress() {
                const currentTime = video.currentTime;
                const duration = video.duration;
                const progress = currentTime / duration;

                // Update active bar
                const activeIndex = Math.floor(progress * 4);
                progressBars.forEach((bar, index) => {
                    if (index === activeIndex) {
                        bar.classList.add('active');
                    } else {
                        bar.classList.remove('active');
                    }
                });
            }

            // Set up video event listeners
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('ended', function() {
                this.currentTime = 0;
                this.play();
            });
            video.addEventListener('pause', function() {
                if (!this.paused) return;
                setTimeout(() => {
                    this.play();
                }, 100);
            });
            video.addEventListener('stalled', function() {
                this.play();
            });

            // Handle tab visibility change
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && video.paused) {
                    video.play();
                }
            });

            // Click on progress bar to jump to that part
            progressBars.forEach((bar, index) => {
                bar.addEventListener('click', function() {
                    const duration = video.duration;
                    const seekTime = (index / 4) * duration;
                    video.currentTime = seekTime;
                });
            });

            // Scroll-triggered animations for section 2
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Reveal the section title words
                        const titleWords = entry.target.querySelector('.section-title').querySelectorAll('span');
                        titleWords.forEach((word, index) => {
                            word.style.animationDelay = `${index * 0.15}s`;
                        });

                        // Reveal house cards
                        const cards = entry.target.querySelectorAll('.house-card');
                        cards.forEach((card, index) => {
                            card.style.animationDelay = `${0.2 + index * 0.15}s`;
                        });
                    }
                });
            }, observerOptions);

            // Observe the section for scroll-triggered animations
            const latestHousesSection = document.querySelector('.section-latest-houses');
            if (latestHousesSection) {
                observer.observe(latestHousesSection);
            }
        });
    </script>
</body>
</html>
